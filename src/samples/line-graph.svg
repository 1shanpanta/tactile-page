<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" width="800" height="600" font-family="Helvetica, Arial, sans-serif" font-size="6.5">
  <title>Line graph of distance against time with labelled points</title>
  <rect width="200" height="150" fill="#ffffff"/>
  <g fill="none" stroke="#222" stroke-width="0.5">
    <polyline points="34,12 34,120 190,120"/>
    <line x1="74" y1="117" x2="74" y2="123"/>
    <line x1="114" y1="117" x2="114" y2="123"/>
    <line x1="154" y1="117" x2="154" y2="123"/>
    <line x1="31" y1="90" x2="37" y2="90"/>
    <line x1="31" y1="60" x2="37" y2="60"/>
    <line x1="31" y1="30" x2="37" y2="30"/>
  </g>
  <g fill="none" stroke="#c0392b" stroke-width="0.4" stroke-dasharray="2 1.4">
    <line x1="114" y1="60" x2="114" y2="117"/>
    <line x1="37" y1="60" x2="114" y2="60"/>
  </g>
  <polyline points="34,120 74,90 114,60 154,30" fill="none" stroke="#1d4f91" stroke-width="0.6"/>
  <g fill="#1d4f91">
    <circle cx="74" cy="90" r="1.1"/>
    <circle cx="114" cy="60" r="1.1"/>
    <circle cx="154" cy="30" r="1.1"/>
  </g>
  <text x="80" y="97">P</text>
  <text x="120" y="67">Q</text>
  <text x="160" y="37">R</text>
  <text x="28" y="126" text-anchor="end">0</text>
  <text x="74" y="131" text-anchor="middle">2</text>
  <text x="114" y="131" text-anchor="middle">4</text>
  <text x="154" y="131" text-anchor="middle">6</text>
  <text x="28" y="92.3" text-anchor="end">10</text>
  <text x="28" y="62.3" text-anchor="end">20</text>
  <text x="28" y="32.3" text-anchor="end">30</text>
  <text x="112" y="144" text-anchor="middle">Time (s)</text>
  <text x="10" y="66" text-anchor="middle" transform="rotate(-90 10 66)">Distance (m)</text>
</svg>
